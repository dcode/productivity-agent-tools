[project]
name = "productivity-agent-tools"
dynamic = ["version"]
description = "MCP server giving an AI agent typed tools for daily work: Jira, Bitbucket and Confluence (Data Center), ServiceNow, Outlook mail and calendar, and an Obsidian vault."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=3.0",
    "httpx>=0.27",
    "keyring>=25.0",
    "markdown-it-py>=4.0",
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "rich>=13",
    "ruamel-yaml>=0.18",
    "structlog>=25.1",
    "truststore>=0.10",
]

[project.scripts]
productivity-agent-tools = "productivity_agent_tools.cli:main"

# Product modules and the integrations between them; see products.py. A separately
# installed package can add its own under the same groups.
[project.entry-points."productivity_agent_tools.products"]
bitbucket = "productivity_agent_tools.bitbucket.product:PRODUCT"
confluence = "productivity_agent_tools.confluence.product:PRODUCT"
jira = "productivity_agent_tools.jira.product:PRODUCT"
obsidian = "productivity_agent_tools.obsidian.product:PRODUCT"
outlook_calendar = "productivity_agent_tools.microsoft.calendar_product:PRODUCT"
outlook_mail = "productivity_agent_tools.microsoft.mail_product:PRODUCT"
servicenow = "productivity_agent_tools.servicenow.product:PRODUCT"

[project.entry-points."productivity_agent_tools.integrations"]
jira_bitbucket = "productivity_agent_tools.links:INTEGRATION"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
    "ty>=0.0.100",
]

# The documentation site (mkdocs.yml, published to GitHub Pages). Kept apart from dev
# so the app and its tests never depend on it: `uv run --group docs mkdocs serve`.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/productivity_agent_tools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/productivity_agent_tools"]

# Default environment: `hatch run <script>` and `hatch shell`.
[tool.hatch.envs.default]
installer = "uv"
dependency-groups = ["dev"]

[tool.hatch.envs.default.scripts]
types = "ty check {args}"
hooks = "pre-commit run --all-files {args}"
doctor = "productivity-agent-tools doctor {args}"
check = [
    "hooks",
    "pytest",
]

# `hatch run docs:serve` previews the documentation site; `hatch run docs:build` builds it
# the way CI does, failing on a broken link or a page left out of the navigation.
[tool.hatch.envs.docs]
installer = "uv"
dependency-groups = ["docs"]
detached = true

[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve {args}"
build = "mkdocs build --strict {args}"

# `hatch test`: coverage comes from pytest-cov (see [tool.pytest.ini_options]),
# so plain runs and `--cover` runs behave the same and both enforce the threshold.
[tool.hatch.envs.hatch-test]
installer = "uv"
default-args = ["tests"]
extra-dependencies = [
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14"]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "python -c \"\""
cov-report = "coverage report"

# `hatch fmt`: use this project's [tool.ruff] settings instead of hatch's defaults.
[tool.hatch.envs.hatch-static-analysis]
installer = "uv"
config-path = "none"
dependencies = ["ruff>=0.17"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The example plugin (docs/contributing/plugin.md) is tested without installing it.
pythonpath = ["examples/holidays-plugin/src"]
addopts = ["--cov", "--cov-report=term-missing:skip-covered"]

[tool.coverage.run]
source = ["productivity_agent_tools"]
branch = true

[tool.coverage.report]
# Every line and branch is covered; a change that leaves one untested fails.
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN", "ASYNC", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "ASYNC240"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["examples/holidays-plugin/src"]

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.terminal]
error-on-warning = true

[tool.rumdl]
line-length = 100
exclude = [".venv", "LICENSE", "contrib/obsidian"]
