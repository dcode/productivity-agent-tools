# DoD / OWA-webmail Microsoft settings — copy these tables into your config
# (~/.config/productivity-agent-tools/config.toml).
#
# None of these values is a secret: the client_id and tenant appear in every
# token the browser issues, and the origin/redirect_uri are the public webmail
# single-page-app registration. The only secret is the refresh token, which the
# browser sign-in collects and keeps in the system keychain:
#
#   productivity-agent-tools login microsoft
#
# If the browser sign-in cannot run, store a refresh token captured by hand:
#
#   productivity-agent-tools set-token microsoft      # paste the refresh token, or
#   productivity-agent-tools set-token microsoft --from-response token.json
#
# Observed from a real DoD webmail sign-in (2026-11-14). This is a stopgap over
# the Outlook REST API while the proper Microsoft Graph client awaits admin
# consent; see docs/ROADMAP.md.

# [microsoft] is not a served product: it only tells `login microsoft` how to
# sign in and the tools how to renew the refresh token. The calendar and mail data is served by the
# [outlook_calendar] and [outlook_mail] products below, which share this token.
[microsoft]
# The OWA/webmail single-page application the browser signs in as.
client_id = "9199bf20-a13f-4107-85dc-02114787ef48"
# The DoD tenant (also fine: "organizations").
tenant = "fae6d70f-954b-4811-92b6-0530d6f84c43"
# The gov-cloud login host (commercial clouds use login.microsoftonline.com).
authority = "login.microsoftonline.us"
# The single-page-app client's refresh token is only redeemed for a request
# carrying an Origin that matches a registered redirect URI.
origin = "https://webmail.apps.mil"
redirect_uri = "https://webmail.apps.mil/mail/oauthRedirect.html"
# The Outlook resource; .default asks for everything the client is consented for.
scope = "https://outlook-dod.office365.us/.default"
# How long the tenant lets one sign-in be renewed: the DoD Conditional Access
# sign-in frequency, observed as 18 h (AADSTS70043 after that). Only used to tell
# you (and the status tools) when to run `login microsoft` again.
sign_in_hours = 18
# Browser that `login microsoft` starts (default: Chrome, then Edge), and how
# long it waits for you to finish signing in.
# browser = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
# login_timeout_seconds = 300

# Shared connection for the Outlook products: the base URL lives here once, and
# no cookies table means they inherit none (this host has no DoD consent banner,
# so your Atlassian [cookies] must not reach it). Keep your Atlassian host and
# banner cookie in their own group (e.g. [group.atlassian]) so the top level
# stays neutral.
[group.microsoft]
base_url = "https://outlook-dod.office365.us/api/v2.0"

# Read-only Microsoft 365 calendar tools (outlook_calendar_*). Remove this table
# to turn calendar off.
[outlook_calendar]
group = "microsoft"

# Read-only Microsoft 365 mail tools (outlook_mail_*). Remove this table to turn
# mail off.
[outlook_mail]
group = "microsoft"
