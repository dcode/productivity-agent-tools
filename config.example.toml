# Copy to ~/.config/productivity-agent-tools/config.toml and edit.
# This file names your internal host, so the real one must never be committed.

# base_url, ca_bundle, timeout_seconds, token_cmd, token_env_file and [cookies] at
# the top of this file are the defaults for every product. A product's own table (such as [jira]) can set
# any of them again to override it for that product alone. Between the two, a
# [group.<name>] table holds shared connection values for the products that name
# it with group = "<name>" (see [group.atlassian] below): each value resolves
# product -> group -> top level. Put a host and its banner cookie in a group when
# several products share them, so the top level stays neutral for products on
# other hosts (such as Microsoft 365).

# Default scheme and host. Each product's own sub-path goes in its table below
# (path under [jira]), not here. Only add a path here if every product sits
# behind a shared prefix, as in https://corp.example.com/atlassian.
# Leave this out if every product names its own base_url.
base_url = "https://atlassian.example.com"

# TLS is verified against the operating system's trust store by default, so
# internal CAs your browser already trusts just work. Only set this to pin trust
# to a specific PEM bundle (on macOS, `productivity-agent-tools export-ca` writes one).
# ca_bundle = "~/ca-bundle.pem"

# Writes are blocked while this is true. Accepts true/false or 1/0.
# Override per run with --dry-run / --no-dry-run.
dry_run = true

# Where the Jira, Bitbucket and Confluence tokens come from, besides the
# environment (JIRA_TOKEN and so on, checked first) and the system keychain
# (where `productivity-agent-tools set-token` puts them, checked last). Both can
# also go in a [group.<name>] table or a product's own table; the most specific
# wins. Paths may use ~, $HOME or ${HOME}.
#
# A command that prints the token, run without a shell (use sh -c '...' for a
# pipe), with a 30-second limit. {product} becomes jira, bitbucket or confluence.
# As a string it is read like a shell command line: ~ and $VARS expand, except
# inside single quotes (so awk's '{ print $2 }' is safe). As a list it is used
# exactly as written.
# token_cmd = "sops -d --extract '[\"{product}\"]' ~/.secrets/tokens.yaml"
# token_cmd = ["pass", "show", "work/{product}"]
#
# An env file with lines such as JIRA_TOKEN=... and BITBUCKET_TOKEN=...
# (checked after token_cmd). --token-env-file overrides it everywhere.
# {product} works here too, for one file per product; a product with no file of
# its own is then skipped rather than an error.
# token_env_file = "${HOME}/.secrets/tokens.env"
# token_env_file = "~/.secrets/{product}_token.env"

timeout_seconds = 30

# Least severe level logged to stderr: debug, info, warning or error.
# debug adds one line per HTTP request and response (status, redirect target,
# names of cookies set) and never the token, cookie values or bodies.
# Override per run with --log-level.
# log_level = "info"

# Optional: extra cookies sent with every request. Nothing is sent by default.
# One use is a proxy that shows a consent or terms-of-use banner and only lets
# requests through once a cookie records that you accepted it. Adding that
# cookie here is you accepting the banner. Find its name and value in your
# browser's developer tools after clicking through the banner.
# Add or override per run with --cookie name=value.
# [cookies]
# consent_accepted = "1"

# Optional: a group of shared connection values. A product joins it with
# group = "<name>" and inherits these unless it sets its own. Use this when
# several products share a host (and a banner cookie) so you declare them once
# and keep the top level neutral for products on other hosts. A product's group
# must have a table here, or it is a config error.
# [group.atlassian]
# base_url = "https://atlassian.example.com"
# [group.atlassian.cookies]
# consent_accepted = "1"

# Each product is switched on by having its table here: remove or comment out a
# table (and everything under it) and that product's tools are not offered.
# An empty table turns a product on with its defaults.

[jira]
# Sub-path Jira is served under. Use "" when Jira is at the root of the host,
# as in https://jira.example.com/.
path = "/jira"
default_max_results = 25

# Optional: Jira on a host of its own, or with its own token source. These
# override the top-level (and group) values for Jira only.
# base_url = "https://jira.example.com"
# path = ""
# ca_bundle = "~/jira-ca.pem"
# timeout_seconds = 60
# token_env_file = "~/.secrets/jira_token.env"
# group = "atlassian"

# Optional: cookies for Jira only. This table replaces the top-level [cookies]
# for Jira instead of adding to it, so a cookie meant for one host is not sent
# to another. An empty table sends none. Place it after [jira.presets].
# [jira.cookies]
# consent_accepted = "1"

# Named JQL queries the agent can run by name. Edit to match your boards.
[jira.presets]
mine-open = "assignee = currentUser() AND resolution = Unresolved ORDER BY updated DESC"
updated-since-yesterday = "assignee = currentUser() AND updated >= startOfDay(-1d) ORDER BY updated DESC"
current-sprint = "assignee = currentUser() AND sprint in openSprints() ORDER BY status ASC, updated DESC"

# Optional: Bitbucket tools (reads, plus pull-request comments and reviews,
# which dry_run blocks like Jira's writes). They are off until this table exists.
# Bitbucket needs its own token: run `productivity-agent-tools set-token bitbucket`.
# [bitbucket]
# Sub-path Bitbucket is served under. Use "" when it is at the root of its host.
# path = "/bitbucket"
# default_max_results = 25
# Project key used when the agent names no project. The agent can also choose
# one for a session with the bitbucket_set_default_project tool.
# default_project = "PROJ"
# Your Bitbucket user slug. Leave unset: the server asks Bitbucket who the token
# belongs to. Set it only if bitbucket_status shows no user.
# user_slug = "jdoe"
# Set to false when no CI or CD server reports builds or deployments to this
# Bitbucket: the build and deployment tools are then not offered to the agent.
# ci = false
# Like [jira], this table can set its own base_url, ca_bundle, timeout_seconds,
# token_cmd, token_env_file, group and a [bitbucket.cookies] table.
# base_url = "https://bitbucket.example.com"

# Optional: Confluence tools (reads, plus creating and editing pages, which
# dry_run blocks like the other writes). They are off until this table exists.
# Confluence needs its own token: run
# `productivity-agent-tools set-token confluence`.
# [confluence]
# Sub-path Confluence is served under. Use "" when it is at the root of its host.
# path = "/confluence"
# default_max_results = 25
# Space key used when the agent names no space, such as your personal space
# (~ followed by your username). The agent can also choose one for a session
# with the confluence_set_default_space tool.
# default_space = "~jdoe"
# Like [jira], this table can set its own base_url, ca_bundle, timeout_seconds,
# token_cmd, token_env_file, group and a [confluence.cookies] table.
# base_url = "https://confluence.example.com"

# Optional: Microsoft 365 calendar and mail over the Outlook REST API, read-only
# (a stopgap while the Microsoft Graph client awaits admin consent; see
# docs/ROADMAP.md). There is no password: run `productivity-agent-tools login
# microsoft`, sign in in the browser window it opens, and the refresh token is
# kept in the system keychain and renewed silently until the tenant's sign-in
# window ends (about 18 hours on the DoD tenant). The OAuth values below are
# environment-specific and not secret; DoD / OWA-webmail users can copy the
# ready-made block from contrib/microsoft-dod.toml.
#
# [microsoft] says how `login microsoft` signs in; it is not a served product. The
# tools are the two products below; they share the Outlook host through a group
# so the base_url is written once there, and that host has no consent banner, so
# keep your Atlassian cookie out of its group.
# [microsoft]
# client_id = "<the sign-in app's client id>"
# tenant = "<your tenant id, or organizations>"
# authority = "login.microsoftonline.us"   # or login.microsoftonline.com
# origin = "<the webmail origin, e.g. https://webmail.example.mil>"
# redirect_uri = "<a registered redirect URI under that origin>"
# scope = "<resource>/.default, e.g. https://outlook-dod.office365.us/.default"
# Browser that `login microsoft` starts. Default: Chrome, then Edge.
# browser = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
# How long `login microsoft` waits for you to finish signing in.
# login_timeout_seconds = 300
# How long your tenant lets one sign-in be renewed (its Conditional Access
# sign-in frequency), so the status tools can say when to sign in again.
# sign_in_hours = 18
#
# [group.microsoft]
# base_url = "https://outlook-dod.office365.us/api/v2.0"
# [outlook_calendar]
# group = "microsoft"
# [outlook_mail]
# group = "microsoft"

# Optional: ServiceNow (a helpdesk behind single sign-on). Off until this table
# exists. There is no token: run `productivity-agent-tools login servicenow`,
# sign in in the browser window it opens, and the session is kept in the
# system keychain until ServiceNow times it out.
# [servicenow]
# base_url = "https://helpdesk.example.com"
# Browser that `login servicenow` starts. Default: Chrome, then Edge.
# browser = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
# How long `login servicenow` waits for you to finish signing in.
# login_timeout_seconds = 300
# An empty cookies table, so the top-level [cookies] are not sent to this host.
# [servicenow.cookies]
