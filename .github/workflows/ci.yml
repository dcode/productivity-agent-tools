name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pre-commit hooks (ruff, rumdl, taplo, ty)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests with coverage (fails below the threshold in pyproject.toml)
        run: uv run pytest

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build the documentation site (fails on a broken link or a page left out)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --locked --only-group docs mkdocs build --strict

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Install the wheel into a clean environment and run it
        run: |
          uv venv --python 3.14 /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/productivity-agent-tools --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
