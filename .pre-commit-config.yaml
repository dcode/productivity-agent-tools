# Install once with: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # The plugin guide's Python blocks hold only snippet markers (--8<--), which
        # the docs build fills from files ruff already formats.
        exclude: ^docs/contributing/plugin\.md$

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.2
    hooks:
      - id: rumdl
      - id: rumdl-fmt

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        # Syntax-only: taplo cannot parse the current online schema catalog, and
        # skipping it keeps the hook working without network access.
        args: [--no-schema]

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
